<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Chatbot</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --user: #3b6cf6; --user-text: #ffffff; --bot: #eceef3; --border: #dfe2ea;
    --ok: #1e8e3e; --err: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2027; --text: #e6e8ee; --muted: #9096a3;
      --user: #4a78ff; --user-text: #ffffff; --bot: #2a2e38; --border: #323744;
      --ok: #5bc77a; --err: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column;
    background: var(--card); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .upload {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  .drop {
    border: 2px dashed var(--border); border-radius: 12px; padding: 16px;
    text-align: center; color: var(--muted); font-size: 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.drag { border-color: var(--user); background: var(--bg); }
  .drop strong { color: var(--text); }
  .upload-row { display: flex; gap: 8px; align-items: center; }
  .file-name { flex: 1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 13px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .error { color: var(--err); }
  .typing { color: var(--muted); font-style: italic; }

  .input-row { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  #question {
    flex: 1; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
  }
  #question:focus { border-color: var(--user); }
  #question:disabled { opacity: .5; }
  button {
    padding: 10px 20px; font-size: 15px; border: none; border-radius: 10px;
    background: var(--user); color: var(--user-text); cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #file { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ask your PDF</h1>
    <p>Upload a PDF, then ask questions about it</p>
  </header>

  <div class="upload">
    <label class="drop" id="drop" for="file">
      <strong>Click to choose a PDF</strong> or drag and drop it here
    </label>
    <input id="file" type="file" accept="application/pdf,.pdf">
    <div class="upload-row">
      <span class="file-name" id="fileName">No file selected</span>
      <span class="status" id="status"></span>
      <button id="uploadBtn" disabled>Upload</button>
    </div>
  </div>

  <div id="chat">
    <div class="msg bot">Hi! Upload a PDF above to get started.</div>
  </div>

  <div class="input-row">
    <input id="question" type="text" placeholder="Upload a PDF first..." autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </div>
</div>

<script>
  const BASE_URL = "http://127.0.0.1:8000";

  const chat = document.getElementById("chat");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const fileInput = document.getElementById("file");
  const fileNameEl = document.getElementById("fileName");
  const uploadBtn = document.getElementById("uploadBtn");
  const statusEl = document.getElementById("status");
  const drop = document.getElementById("drop");

  let selectedFile = null;
  let activeFilename = null; // name of the PDF saved on the server

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status " + (cls || "");
  }

  function selectFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".pdf")) {
      setStatus("Please choose a PDF file", "err");
      return;
    }
    selectedFile = file;
    fileNameEl.textContent = file.name;
    uploadBtn.disabled = false;
    setStatus("");
  }

  fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", e => selectFile(e.dataTransfer.files[0]));

  uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    uploadBtn.disabled = true;
    setStatus("Uploading...");

    const formData = new FormData();
    formData.append("file", selectedFile);

    try {
      const res = await fetch(BASE_URL + "/upload", { method: "POST", body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Server returned " + res.status);
      }
      const data = await res.json();
      activeFilename = data.filename;

      setStatus("Uploaded ✓", "ok");
      input.disabled = false;
      sendBtn.disabled = false;
      input.placeholder = "Type your question...";
      input.focus();
      addMessage("Loaded \"" + activeFilename + "\". Ask me anything about it!", "bot");
    } catch (err) {
      setStatus("Upload failed: " + err.message, "err");
    } finally {
      uploadBtn.disabled = false;
    }
  });

  async function ask() {
    const question = input.value.trim();
    if (!question || !activeFilename) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;
    input.disabled = true;
    const loading = addMessage("Thinking...", "bot typing");

    try {
      const url = BASE_URL + "/get_answer"
        + "?question=" + encodeURIComponent(question)
        + "&filename=" + encodeURIComponent(activeFilename);
      const res = await fetch(url, { method: "POST" });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Server returned " + res.status);
      }
      const data = await res.json();
      loading.className = "msg bot";
      loading.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
    } catch (err) {
      loading.className = "msg bot error";
      loading.textContent = "Error: " + err.message;
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  sendBtn.addEventListener("click", ask);
  input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
